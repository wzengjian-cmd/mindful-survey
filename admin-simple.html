<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正念训练营数据管理后台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .content {
            padding: 25px;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .stat-card.success {
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
        }

        .stat-card.warning {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
        }

        .stat-card.danger {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .stat-number {
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .table-container {
            overflow-x: auto;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: #3498db;
            color: white;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .status-eligible {
            background: #d4edda;
            color: #155724;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.9em;
        }

        .status-observe {
            background: #fff3cd;
            color: #856404;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.9em;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            transition: all 0.3s;
        }

        .back-link:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            body {
                padding: 5px;
            }

            .stats-container {
                grid-template-columns: 1fr 1fr;
            }

            .controls {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                max-width: 200px;
            }

            .table-container {
                font-size: 14px;
            }

            th, td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="./" class="back-link">← 返回问卷</a>
            <h1>📊 数据管理后台</h1>
            <p>正念训练营报名数据统计与管理</p>
        </div>

        <div class="content">
            <div id="message" class="message" style="display: none;"></div>

            <div class="stats-container">
                <div class="stat-card">
                    <div class="stat-number" id="totalCount">0</div>
                    <div class="stat-label">总报名人数</div>
                </div>
                <div class="stat-card success">
                    <div class="stat-number" id="eligibleCount">0</div>
                    <div class="stat-label">符合条件人数</div>
                </div>
                <div class="stat-card warning">
                    <div class="stat-number" id="observeCount">0</div>
                    <div class="stat-label">待观察人数</div>
                </div>
                <div class="stat-card danger">
                    <div class="stat-number" id="avgScore">0</div>
                    <div class="stat-label">平均总分</div>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" onclick="loadData()">🔄 刷新数据</button>
                <button class="btn btn-success" onclick="exportData()">📥 导出Excel</button>
                <button class="btn btn-primary" onclick="showDetailedData()">📋 详细数据</button>
            </div>

            <div id="loading" class="loading" style="display: none;">
                <p>🔄 正在加载数据...</p>
            </div>

            <div id="dataContainer">
                <!-- 数据将在这里显示 -->
            </div>
        </div>
    </div>

    <script>
        let currentData = [];

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
        });

        // 加载数据
        function loadData() {
            showLoading(true);
            showMessage('正在加载数据...', 'info');

            // 尝试从本地存储加载数据
            const localData = localStorage.getItem('mindfulSurveyData');
            if (localData) {
                currentData = JSON.parse(localData);
                displayData(currentData);
                showLoading(false);
                showMessage('数据加载成功', 'success');
                return;
            }

            // 如果本地没有数据，尝试从API加载
            fetch('/api/store-data')
                .then(response => response.json())
                .then(data => {
                    currentData = Array.isArray(data) ? data : [];
                    displayData(currentData);
                    showLoading(false);
                    showMessage('数据加载成功', 'success');
                })
                .catch(error => {
                    console.error('加载数据失败:', error);
                    showLoading(false);
                    showMessage('数据加载失败，请检查网络连接', 'error');
                    
                    // 显示示例数据
                    const sampleData = [
                        {
                            name: "测试用户1",
                            phone: "13800138000",
                            stateTotal: 12,
                            traitTotal: 16,
                            timestamp: new Date().toISOString(),
                            isEligible: true
                        },
                        {
                            name: "测试用户2", 
                            phone: "13900139000",
                            stateTotal: 8,
                            traitTotal: 12,
                            timestamp: new Date().toISOString(),
                            isEligible: false
                        }
                    ];
                    currentData = sampleData;
                    displayData(sampleData);
                });
        }

        // 显示数据
        function displayData(data) {
            if (!data || data.length === 0) {
                document.getElementById('dataContainer').innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #666;">
                        <p style="font-size: 1.2em; margin-bottom: 20px;">暂无数据</p>
                        <p>学生填写问卷后，数据将在这里显示</p>
                    </div>
                `;
                updateStats([]);
                return;
            }

            const tableHtml = `
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>序号</th>
                                <th>姓名</th>
                                <th>电话</th>
                                <th>状态分</th>
                                <th>特质分</th>
                                <th>总分</th>
                                <th>评估结果</th>
                                <th>提交时间</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.map((item, index) => {
                                const stateTotal = item.stateTotal || (item.stateAnxietyScores || []).reduce((a, b) => a + b, 0);
                                const traitTotal = item.traitTotal || (item.traitAnxietyScores || []).reduce((a, b) => a + b, 0);
                                const total = stateTotal + traitTotal;
                                const isEligible = stateTotal >= 10 && traitTotal >= 14;
                                const time = item.timestamp ? new Date(item.timestamp).toLocaleString() : '未知';

                                return `
                                    <tr>
                                        <td><strong>${index + 1}</strong></td>
                                        <td>${item.name || '未知'}</td>
                                        <td><a href="tel:${item.phone}">${item.phone || '未填写'}</a></td>
                                        <td>${stateTotal}</td>
                                        <td>${traitTotal}</td>
                                        <td><strong>${total}</strong></td>
                                        <td>
                                            <span class="${isEligible ? 'status-eligible' : 'status-observe'}">
                                                ${isEligible ? '✅ 符合条件' : '⏳ 待观察'}
                                            </span>
                                        </td>
                                        <td>${time}</td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;

            document.getElementById('dataContainer').innerHTML = tableHtml;
            updateStats(data);
        }

        // 更新统计数据
        function updateStats(data) {
            if (!data || data.length === 0) {
                document.getElementById('totalCount').textContent = '0';
                document.getElementById('eligibleCount').textContent = '0';
                document.getElementById('observeCount').textContent = '0';
                document.getElementById('avgScore').textContent = '0';
                return;
            }

            const totalCount = data.length;
            let eligibleCount = 0;
            let observeCount = 0;
            let totalScore = 0;

            data.forEach(item => {
                const stateTotal = item.stateTotal || (item.stateAnxietyScores || []).reduce((a, b) => a + b, 0);
                const traitTotal = item.traitTotal || (item.traitAnxietyScores || []).reduce((a, b) => a + b, 0);
                const total = stateTotal + traitTotal;
                
                totalScore += total;
                
                if (stateTotal >= 10 && traitTotal >= 14) {
                    eligibleCount++;
                } else {
                    observeCount++;
                }
            });

            const avgScore = Math.round(totalScore / totalCount);

            // 动画更新数字
            animateNumber('totalCount', totalCount);
            animateNumber('eligibleCount', eligibleCount);
            animateNumber('observeCount', observeCount);
            animateNumber('avgScore', avgScore);
        }

        // 数字动画
        function animateNumber(elementId, targetNumber) {
            const element = document.getElementById(elementId);
            const startNumber = parseInt(element.textContent) || 0;
            const duration = 1000;
            const startTime = Date.now();

            function update() {
                const currentTime = Date.now();
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                const currentNumber = Math.round(startNumber + (targetNumber - startNumber) * progress);
                element.textContent = currentNumber;

                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }

            update();
        }

        // 显示详细数据
        function showDetailedData() {
            if (!currentData || currentData.length === 0) {
                showMessage('暂无详细数据', 'info');
                return;
            }

            let detailedHtml = `
                <div style="max-height: 600px; overflow-y: auto;">
                    <h3 style="margin-bottom: 20px;">📋 详细数据</h3>
                    ${currentData.map((item, index) => {
                        const stateTotal = item.stateTotal || (item.stateAnxietyScores || []).reduce((a, b) => a + b, 0);
                        const traitTotal = item.traitTotal || (item.traitAnxietyScores || []).reduce((a, b) => a + b, 0);
                        const total = stateTotal + traitTotal;
                        const isEligible = stateTotal >= 10 && traitTotal >= 14;
                        const time = item.timestamp ? new Date(item.timestamp).toLocaleString() : '未知';

                        return `
                            <div style="background: ${isEligible ? '#d4edda' : '#fff3cd'}; padding: 20px; margin-bottom: 15px; border-radius: 10px; border-left: 4px solid ${isEligible ? '#27ae60' : '#f39c12'};">
                                <h4>📋 记录 ${index + 1}: ${item.name || '未知'}</h4>
                                <p><strong>📞 电话：</strong><a href="tel:${item.phone}">${item.phone || '未填写'}</a></p>
                                <p><strong>📊 状态焦虑：</strong>${stateTotal}分</p>
                                <p><strong>📊 特质焦虑：</strong>${traitTotal}分</p>
                                <p><strong>📊 总分：</strong><strong style="color: ${isEligible ? '#27ae60' : '#f39c12'};">${total}分</strong></p>
                                <p><strong>🎯 评估结果：</strong>${isEligible ? '✅ 符合条件' : '⏳ 待观察'}</p>
                                <p><strong>⏰ 提交时间：</strong>${time}</p>
                                ${item.ip ? `<p><strong>🌐 IP地址：</strong>${item.ip}</p>` : ''}
                            </div>
                        `;
                    }).join('')}
                </div>
            `;

            document.getElementById('dataContainer').innerHTML = detailedHtml;
        }

        // 导出数据
        function exportData() {
            if (!currentData || currentData.length === 0) {
                showMessage('暂无数据可导出', 'error');
                return;
            }

            let csv = '序号,姓名,电话,状态焦虑分,特质焦虑分,总分,评估结果,提交时间\n';
            
            currentData.forEach((item, index) => {
                const stateTotal = item.stateTotal || (item.stateAnxietyScores || []).reduce((a, b) => a + b, 0);
                const traitTotal = item.traitTotal || (item.traitAnxietyScores || []).reduce((a, b) => a + b, 0);
                const total = stateTotal + traitTotal;
                const isEligible = stateTotal >= 10 && traitTotal >= 14;
                const time = item.timestamp ? new Date(item.timestamp).toLocaleString() : '未知';
                
                csv += `${index + 1},"${item.name || ''}","${item.phone || ''}",${stateTotal},${traitTotal},${total},"${isEligible ? '符合条件' : '待观察'}","${time}"\n`;
            });

            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `正念训练营数据_${new Date().toLocaleDateString().replace(/\//g, '-')}.csv`;
            link.click();

            showMessage(`成功导出 ${currentData.length} 条数据`, 'success');
        }

        // 显示加载状态
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        // 显示消息
        function showMessage(text, type = 'info') {
            const messageEl = document.getElementById('message');
            messageEl.className = `message ${type}`;
            messageEl.textContent = text;
            messageEl.style.display = 'block';

            // 3秒后自动隐藏
            setTimeout(() => {
                messageEl.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
