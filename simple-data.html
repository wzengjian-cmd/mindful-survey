<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据查看</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        .header { text-align: center; margin-bottom: 20px; }
        .stats { display: flex; justify-content: space-around; margin-bottom: 20px; }
        .stat { text-align: center; padding: 15px; background: #3498db; color: white; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #f4f4f4; }
        .eligible { background: #d4edda; }
        .not-eligible { background: #fff3cd; }
        button { padding: 10px 20px; margin: 5px; border: none; border-radius: 5px; cursor: pointer; }
        .btn-primary { background: #007bff; color: white; }
        .btn-success { background: #28a745; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 数据查看</h1>
            <button class="btn-primary" onclick="loadData()">🔄 刷新数据</button>
            <button class="btn-success" onclick="exportData()">📥 导出Excel</button>
        </div>

        <div class="stats">
            <div class="stat">
                <h3 id="total">0</h3>
                <p>总人数</p>
            </div>
            <div class="stat">
                <h3 id="eligible">0</h3>
                <p>符合条件</p>
            </div>
            <div class="stat">
                <h3 id="waiting">0</h3>
                <p>待观察</p>
            </div>
        </div>

        <table id="dataTable">
            <thead>
                <tr>
                    <th>序号</th>
                    <th>姓名</th>
                    <th>电话</th>
                    <th>状态分</th>
                    <th>特质分</th>
                    <th>总分</th>
                    <th>结果</th>
                    <th>时间</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>

    <script>
        let allData = [];

        // 页面加载
        window.onload = loadData;

        async function loadData() {
            try {
                // 尝试从get-data.js获取
                let response = await fetch('/api/get-data');
                let result = await response.json();
                
                if (result.success && result.data) {
                    allData = result.data;
                    console.log('成功加载数据:', allData.length, '条');
                } else {
                    throw new Error('无数据');
                }
            } catch (error) {
                console.error('获取数据失败:', error);
                allData = [];
            }

            updateDisplay();
        }

        function updateDisplay() {
            updateStats();
            updateTable();
        }

        function updateStats() {
            const total = allData.length;
            const eligible = allData.filter(item => {
                const stateTotal = (item.stateAnxietyScores || []).reduce((a, b) => a + b, 0);
                const traitTotal = (item.traitAnxietyScores || []).reduce((a, b) => a + b, 0);
                return stateTotal >= 10 && traitTotal >= 14;
            }).length;
            const waiting = total - eligible;

            document.getElementById('total').textContent = total;
            document.getElementById('eligible').textContent = eligible;
            document.getElementById('waiting').textContent = waiting;
        }

        function updateTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            allData.forEach((item, index) => {
                const stateTotal = (item.stateAnxietyScores || []).reduce((a, b) => a + b, 0);
                const traitTotal = (item.traitAnxietyScores || []).reduce((a, b) => a + b, 0);
                const total = stateTotal + traitTotal;
                const isEligible = stateTotal >= 10 && traitTotal >= 14;

                const row = document.createElement('tr');
                row.className = isEligible ? 'eligible' : 'not-eligible';
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${item.name || '未知'}</td>
                    <td>${item.phone || '未填写'}</td>
                    <td>${stateTotal}</td>
                    <td>${traitTotal}</td>
                    <td><strong>${total}</strong></td>
                    <td>${isEligible ? '✅ 符合' : '⏳ 待观察'}</td>
                    <td>${new Date(item.timestamp).toLocaleString()}</td>
                `;
                tbody.appendChild(row);
            });

            if (allData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">暂无数据</td></tr>';
            }
        }

        function exportData() {
            if (allData.length === 0) {
                alert('暂无数据可导出');
                return;
            }

            let csv = '序号,姓名,电话,状态分,特质分,总分,结果,时间\n';
            allData.forEach((item, index) => {
                const stateTotal = (item.stateAnxietyScores || []).reduce((a, b) => a + b, 0);
                const traitTotal = (item.traitAnxietyScores || []).reduce((a, b) => a + b, 0);
                const total = stateTotal + traitTotal;
                const isEligible = stateTotal >= 10 && traitTotal >= 14;
                
                csv += `${index + 1},"${item.name || ''}","${item.phone || ''}",${stateTotal},${traitTotal},${total},"${isEligible ? '符合条件' : '待观察'}","${item.timestamp}"\n`;
            });

            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `数据_${new Date().toLocaleDateString()}.csv`;
            link.click();
        }
    </script>
</body>
</html>
